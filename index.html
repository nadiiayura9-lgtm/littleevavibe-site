<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Eva Vibe</title>

<style>

body{margin:0;font-family:Arial;background:#fafafa}

header{

padding:18px;

text-align:center;

background:#fff;

border-bottom:1px solid #eee;

letter-spacing:2px;

}

.products{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:20px;

padding:20px;

}

.card{

background:#fff;

border:1px solid #eee;

}

.card img{

width:100%;

height:220px;

object-fit:cover;

}

.card-body{

padding:10px;

text-align:center;

}

button{

width:100%;

padding:8px;

background:#111;

color:#fff;

border:none;

cursor:pointer;

}

.cart{

position:fixed;

bottom:20px;

right:20px;

background:#111;

color:#fff;

padding:10px 14px;

border-radius:30px;

cursor:pointer;

}

</style>

</head>

<body>

<header>💎 LITTLE EVA VIBE</header>

<div class="products" id="products"></div>

<div class="cart">🛒 <span id="count">0</span></div>

<script type="module" src="app.js"></script>
  
</body>
</html>
