<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LittleEvaVibe</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{

  margin:0;

  font-family:Inter;

  background:#f6f1ec;

  color:#1f1f1f;

}

/* HEADER */

header{

  text-align:center;

  padding:30px 20px;

}

h1{

  font-family:"Playfair Display", serif;

  margin:0;

  font-size:36px;

}

/* GRID */

.grid{

  display:grid;

  grid-template-columns:1fr;

  gap:15px;

  max-width:420px;

  margin:auto;

  padding:10px 15px 100px;

}

/* CARD */

.card{

  background:white;

  border-radius:18px;

  overflow:hidden;

  box-shadow:0 10px 30px rgba(0,0,0,0.06);

}

.card img{

  width:100%;

  height:280px;

  object-fit:cover;

}

.card-body{

  padding:12px;

}

.price{

  font-size:13px;

  opacity:0.6;

}

/* BUTTONS */

.btn{

  display:block;

  padding:10px;

  margin-top:10px;

  border-radius:12px;

  text-align:center;

  text-decoration:none;

  cursor:pointer;

}

.black{background:#1f1f1f;color:white;}

.gray{background:#eee;color:#1f1f1f;}

/* CART */

.cart{

  position:fixed;

  bottom:15px;

  right:15px;

  background:#1f1f1f;

  color:white;

  padding:12px 15px;

  border-radius:50px;

  cursor:pointer;

}

/* MODAL */

.modal{

  display:none;

  position:fixed;

  width:100%;

  height:100%;

  background:rgba(0,0,0,0.6);

  top:0;

  left:0;

}

.modal-content{

  background:white;

  width:90%;

  max-width:350px;

  margin:80px auto;

  border-radius:16px;

  padding:15px;

}

.close{

  float:right;

  cursor:pointer;

}

</style>

</head>

<body>

<header>

  <h1>LittleEvaVibe</h1>

</header>

<!-- PRODUCTS -->

<div class="grid">

  <div class="card">

    <img src="images/photo1.jpg">

    <div class="card-body">

      <b>Сукня преміум</b>

      <div class="price">890 грн</div>

      <button class="btn gray" onclick="add('Сукня преміум',890)">Додати</button>

      <button class="btn black" onclick="openItem('Сукня преміум',890)">Замовити</button>

    </div>

  </div>

  <div class="card">

    <img src="images/photo2.jpg">

    <div class="card-body">

      <b>Костюм стильний</b>

      <div class="price">990 грн</div>

      <button class="btn gray" onclick="add('Костюм стильний',990)">Додати</button>

      <button class="btn black" onclick="openItem('Костюм стильний',990)">Замовити</button>

    </div>

  </div>

</div>

<!-- CART -->

<div class="cart" onclick="openCart()">

🛒 <span id="count">0</span>

</div>

<!-- ITEM MODAL -->

<div class="modal" id="modal">

  <div class="modal-content">

    <span class="close" onclick="closeModal()">✖</span>

    <h3 id="title"></h3>

    <p id="price"></p>

    <button class="btn black" onclick="checkout()">

      Оформити

    </button>

  </div>

</div>

<!-- CART MODAL -->

<div class="modal" id="cart">

  <div class="modal-content">

    <span class="close" onclick="closeCart()">✖</span>

    <h3>Кошик</h3>

    <div id="list"></div>

    <p id="total"></p>

    <button class="btn black" onclick="send()">

      Відправити замовлення

    </button>

  </div>

</div>

<script>

let cart=[];

let current={};

function add(name,price){

  cart.push({name,price});

  document.getElementById("count").innerText=cart.length;

}

function openItem(name,price){

  current={name,price};

  document.getElementById("title").innerText=name;

  document.getElementById("price").innerText=price+" грн";

  document.getElementById("modal").style.display="block";

}

function closeModal(){

  document.getElementById("modal").style.display="none";

}

function checkout(){

  add(current.name,current.price);

  closeModal();

}

function openCart(){

  let t=0;

  let html="";

  cart.forEach(i=>{

    html+=i.name+" - "+i.price+" грн<br>";

    t+=i.price;

  });

  document.getElementById("list").innerHTML=html;

  document.getElementById("total").innerText="Разом: "+t+" грн";

  document.getElementById("cart").style.display="block";

}

function closeCart(){

  document.getElementById("cart").style.display="none";

}

function send(){

  let text="Замовлення:%0A";

  let t=0;

  cart.forEach(i=>{

    text+="- "+i.name+" "+i.price+" грн%0A";

    t+=i.price;

  });

  text+="%0AРазом: "+t+" грн";

  navigator.clipboard.writeText(text);

  window.open("https://ig.me/m/littleevavibe","_blank");

  alert("Замовлення скопійовано і відкрито Instagram 💎");

}

</script>

</body>

</html>
