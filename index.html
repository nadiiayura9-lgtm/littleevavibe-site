<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Eva Vibe</title>

<style>

body{

margin:0;

font-family:Arial;

background:#fff7fb;

}

/* HEADER */

header{

background:linear-gradient(135deg,#ffd6e7,#d6fff3);

padding:20px;

text-align:center;

}

.logo{

font-size:26px;

font-weight:bold;

letter-spacing:1px;

}

/* NAV */

nav{

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

padding:10px;

}

nav button{

padding:10px 15px;

border:none;

border-radius:20px;

background:#f3f3f3;

cursor:pointer;

}

/* PRODUCTS */

.products{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(160px,1fr));

gap:15px;

padding:15px;

}

.card{

background:white;

border-radius:15px;

padding:10px;

box-shadow:0 5px 15px rgba(0,0,0,0.08);

}

.card img{

width:100%;

border-radius:10px;

}

button{

width:100%;

padding:8px;

border:none;

border-radius:10px;

background:black;

color:white;

}

/* CART */

.cartBtn{

position:fixed;

bottom:10px;

right:10px;

background:black;

color:white;

padding:10px 15px;

border-radius:20px;

}

#cartBox{

position:fixed;

bottom:60px;

right:10px;

background:white;

width:260px;

padding:10px;

border-radius:15px;

box-shadow:0 5px 20px rgba(0,0,0,0.2);

display:none;

}

</style>

</head>

<body>

<header>

<div class="logo">💖 Little Eva Vibe</div>

</header>

<nav>

<button onclick="filter('all')">Все</button>

<button onclick="filter('girls')">Дівчатка</button>

<button onclick="filter('boys')">Хлопчики</button>

<button onclick="filter('shoes')">Взуття</button>

<button onclick="filter('sale')">SALE</button>

</nav>

<div class="products" id="products"></div>

<div class="cartBtn" onclick="toggleCart()">

🛒 <span id="count">0</span>

</div>

<div id="cartBox"></div>

<!-- ORDER -->

<div id="orderForm" style="display:none;padding:15px;">

<h3>Оформлення замовлення</h3>

<input id="name" placeholder="Ім'я"><br><br>

<input id="phone" placeholder="Телефон"><br><br>

<button onclick="sendOrder()">Підтвердити</button>

</div>

<script>

// ===== FIREBASE ПІЗНІШЕ ПІДКЛЮЧАЄТЬСЯ =====

let products = [

{

name:"Сукня ніжна",

price:650,

img:"https://via.placeholder.com/200",

cat:"girls"

},

{

name:"Костюм хлопчик",

price:800,

img:"https://via.placeholder.com/200",

cat:"boys"

}

];

let cart=[];

function render(list=products){

let box=document.getElementById("products");

box.innerHTML="";

list.forEach((p,i)=>{

box.innerHTML+=`

<div class="card">

<img src="${p.img}">

<h4>${p.name}</h4>

<p>${p.price} грн</p>

<button onclick="add(${i})">Додати</button>

</div>`;

});

}

render();

function filter(cat){

if(cat==="all") render();

else render(products.filter(p=>p.cat===cat));

}

function add(i){

cart.push(products[i]);

document.getElementById("count").innerText=cart.length;

renderCart();

}

function toggleCart(){

document.getElementById("cartBox").style.display =

document.getElementById("cartBox").style.display==="block"?"none":"block";

}

function renderCart(){

let box=document.getElementById("cartBox");

let total=0;

box.innerHTML="<b>Кошик</b><br>";

cart.forEach((c,i)=>{

box.innerHTML+=`${c.name} - ${c.price} грн <br>`;

total+=c.price;

});

box.innerHTML+=`<hr><b>Сума: ${total} грн</b><br>

<button onclick="showOrder()">Оформити</button>`;

}

function showOrder(){

document.getElementById("orderForm").style.display="block";

}

function sendOrder(){

let text=`🛍 Little Eva Vibe

Ім'я: ${name.value}

Телефон: ${phone.value}

Товари: ${cart.map(i=>i.name).join(", ")}`;

fetch("https://api.telegram.org/botTOKEN/sendMessage",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

chat_id:"CHAT_ID",

text:text

})

});

alert("Замовлення відправлено 💖");

cart=[];

}

</script>

</body>

</html>
