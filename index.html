<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Eva Vibe</title>

<style>

body{

margin:0;

font-family:Arial;

background:#fff8fb;

color:#2b2b2b;

}

/* HEADER */

header{

background:linear-gradient(90deg,#ffb6c9,#a8e6cf);

padding:18px;

text-align:center;

font-weight:500;

letter-spacing:2px;

}

/* CATEGORIES */

.cats{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:10px;

padding:15px;

}

.cats button{

border:none;

background:#fff;

padding:8px 12px;

border-radius:20px;

border:1px solid #ffd1dc;

cursor:pointer;

font-size:13px;

}

.cats button.active{

background:#ffb6c9;

}

/* PRODUCTS */

.products{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(160px,1fr));

gap:15px;

padding:15px;

}

.card{

background:#fff;

border-radius:12px;

border:1px solid #ffe0ea;

overflow:hidden;

transition:0.2s;

}

.card:hover{

transform:translateY(-5px);

}

.card img{

width:100%;

height:200px;

object-fit:cover;

}

.card-body{

padding:10px;

text-align:center;

}

.price{

color:#777;

font-size:13px;

margin-top:5px;

}

button.add{

width:100%;

padding:8px;

border:none;

background:linear-gradient(90deg,#ffb6c9,#a8e6cf);

cursor:pointer;

font-weight:500;

}

/* CART */

.cart{

position:fixed;

bottom:20px;

right:20px;

background:linear-gradient(90deg,#ffb6c9,#a8e6cf);

padding:10px 14px;

border-radius:30px;

cursor:pointer;

font-weight:500;

}

#cartBox{

position:fixed;

bottom:70px;

right:20px;

width:260px;

background:#fff;

border:1px solid #ffe0ea;

padding:10px;

display:none;

border-radius:10px;

}

/* ORDER */

.order{

padding:20px;

}

input,textarea{

width:100%;

padding:10px;

margin:5px 0;

border:1px solid #ffd1dc;

border-radius:8px;

outline:none;

}

button.send{

width:100%;

padding:10px;

background:linear-gradient(90deg,#ffb6c9,#a8e6cf);

border:none;

cursor:pointer;

font-weight:600;

}

</style>

</head>

<body>

<header>💖 LITTLE EVA VIBE</header>

<!-- CATEGORIES -->

<div class="cats">

<button class="active" onclick="filter('all',event)">ALL</button>

<button onclick="filter('girls',event)">GIRLS 👧</button>

<button onclick="filter('boys',event)">BOYS 👦</button>

<button onclick="filter('shoes',event)">SHOES 👟</button>

<button onclick="filter('sale',event)">SALE 🔥</button>

</div>

<!-- PRODUCTS -->

<div class="products" id="products"></div>

<!-- CART -->

<div class="cart" onclick="toggleCart()">

🛒 <span id="count">0</span>

</div>

<div id="cartBox"></div>

<!-- ORDER -->

<div class="order">

<h3>Оформлення замовлення</h3>

<input id="name" placeholder="Імʼя">

<input id="phone" placeholder="Телефон">

<textarea id="comment" placeholder="Коментар"></textarea>

<button class="send" onclick="sendOrder()">

Відправити замовлення

</button>

</div>

<script>

let products=[

{name:"Сукня Pink",price:650,cat:"girls",img:"https://images.unsplash.com/photo-1520975682031-ae3a0d4c3c3c"},

{name:"Костюм хлопчик",price:800,cat:"boys",img:"https://images.unsplash.com/photo-1503945438517-f65904a52ce6"},

{name:"Лофери",price:590,cat:"shoes",img:"https://images.unsplash.com/photo-1519681393784-d120267933ba"},

{name:"SALE сукня",price:399,cat:"sale",img:"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c"}

];

let cart=[];

/* RENDER */

function render(list=products){

let box=document.getElementById("products");

box.innerHTML="";

list.forEach((p,i)=>{

box.innerHTML+=`

<div class="card">

<img src="${p.img}">

<div class="card-body">

<h4>${p.name}</h4>

<div class="price">${p.price} грн</div>

<button class="add" onclick="add(${i})">ДОДАТИ</button>

</div>

</div>`;

});

}

render();

/* FILTER */

function filter(cat,e){

document.querySelectorAll(".cats button").forEach(b=>b.classList.remove("active"));

if(e) e.target.classList.add("active");

if(cat==="all") render(products);

else render(products.filter(p=>p.cat===cat));

}

/* CART */

function add(i){

cart.push(products[i]);

document.getElementById("count").innerText=cart.length;

renderCart();

}

function toggleCart(){

document.getElementById("cartBox").style.display =

document.getElementById("cartBox").style.display==="block"?"none":"block";

}

function renderCart(){

let box=document.getElementById("cartBox");

let total=0;

box.innerHTML="<b>Кошик</b><br>";

cart.forEach(c=>{

box.innerHTML+=`${c.name} - ${c.price} грн<br>`;

total+=c.price;

});

box.innerHTML+=`<hr><b>Сума: ${total} грн</b>`;

}

/* TELEGRAM ORDER */

function sendOrder(){

let text =

`💖 Little Eva Vibe

Імʼя: ${name.value}

Телефон: ${phone.value}

Коментар: ${comment.value}

Товари: ${cart.map(i=>i.name).join(", ")}`;

fetch("https://api.telegram.org/botTOKEN/sendMessage",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

chat_id:"CHAT_ID",

text:text

})

});

alert("Замовлення відправлено 💖");

cart=[];

document.getElementById("count").innerText=0
