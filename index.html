<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Eva Vibe</title>

<style>

body{

margin:0;

font-family:Arial;

background:#fff;

color:#222;

}

/* HERO */

.hero{

background:linear-gradient(135deg,#ffd6e7,#d6fff3);

text-align:center;

padding:25px;

}

.hero h1{margin:0;font-size:28px}

/* SOCIAL */

.links{

display:flex;

justify-content:center;

gap:10px;

padding:10px;

}

.links a{

padding:10px 15px;

border-radius:20px;

background:#111;

color:#fff;

text-decoration:none;

font-size:14px;

}

/* CATEGORIES */

.cats{

display:flex;

flex-wrap:wrap;

justify-content:center;

gap:10px;

padding:10px;

}

.cats button{

padding:10px 14px;

border:none;

border-radius:20px;

background:#f3f3f3;

cursor:pointer;

transition:0.3s;

}

.cats button:hover{

background:#ffd6e7;

}

/* PRODUCTS */

.products{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(160px,1fr));

gap:15px;

padding:15px;

}

.card{

border-radius:15px;

overflow:hidden;

box-shadow:0 8px 20px rgba(0,0,0,0.08);

background:#fff;

cursor:pointer;

transition:0.3s;

}

.card:hover{transform:translateY(-5px)}

.card img{

width:100%;

height:180px;

object-fit:cover;

}

.card-body{

padding:10px;

}

.price{

font-weight:bold;

margin-top:5px;

}

button{

width:100%;

padding:8px;

border:none;

background:#111;

color:#fff;

border-radius:10px;

cursor:pointer;

}

/* CART */

.cart{

position:fixed;

bottom:15px;

right:15px;

background:#111;

color:#fff;

padding:12px 15px;

border-radius:30px;

cursor:pointer;

}

#cartBox{

position:fixed;

bottom:70px;

right:15px;

width:270px;

background:#fff;

padding:10px;

box-shadow:0 10px 25px rgba(0,0,0,0.15);

border-radius:15px;

display:none;

}

/* MODAL */

.modal{

position:fixed;

top:0;left:0;

width:100%;height:100%;

background:rgba(0,0,0,0.5);

display:none;

justify-content:center;

align-items:center;

}

.modal-content{

background:#fff;

width:300px;

border-radius:15px;

overflow:hidden;

}

.modal-content img{

width:100%;

height:200px;

object-fit:cover;

}

.modal-body{padding:10px}

/* FORM */

form{

padding:15px;

}

input,textarea{

width:100%;

padding:10px;

margin:5px 0;

border:1px solid #ddd;

border-radius:10px;

}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<h1>💖 Little Eva Vibe</h1>

<p>Дитячий boutique-магазин</p>

</div>

<!-- SOCIAL -->

<div class="links">

<a href="https://t.me/OQSCHnx_zG1jNjQy" target="_blank">Telegram</a>

<a href="https://instagram.com" target="_blank">Instagram</a>

</div>

<!-- CATEGORIES -->

<div class="cats">

<button onclick="filter('all')">Всі</button>

<button onclick="filter('girls')">Дівчатка 👧</button>

<button onclick="filter('boys')">Хлопчики 👦</button>

<button onclick="filter('shoes')">Взуття 👟</button>

<button onclick="filter('access')">Аксесуари 🎀</button>

<button onclick="filter('sale')">SALE 🔥</button>

</div>

<!-- PRODUCTS -->

<div class="products" id="products"></div>

<!-- CART -->

<div class="cart" onclick="toggleCart()">

🛒 <span id="count">0</span>

</div>

<div id="cartBox"></div>

<!-- FORM -->

<form onsubmit="sendOrder(event)">

<h3>Оформлення замовлення</h3>

<input id="name" placeholder="Імʼя" required>

<input id="phone" placeholder="Телефон" required>

<input id="city" placeholder="Місто">

<textarea id="comment" placeholder="Коментар"></textarea>

<input type="file" accept="image/*" onchange="loadPhoto(event)">

<img id="preview" style="width:100%;display:none;border-radius:10px;margin-top:10px;">

<button type="submit">📩 Відправити замовлення</button>

</form>

<!-- MODAL -->

<div class="modal" id="modal" onclick="closeModal(event)">

<div class="modal-content">

<img id="mimg">

<div class="modal-body">

<h3 id="mtitle"></h3>

<p id="mprice"></p>

<button onclick="addModal()">Додати в кошик</button>

</div>

</div>

</div>

<script>

let products=[

{name:"Сукня ніжна",price:650,cat:"girls",img:"https://via.placeholder.com/400"},

{name:"Костюм хлопчик",price:800,cat:"boys",img:"https://via.placeholder.com/400"},

{name:"Лофери",price:590,cat:"shoes",img:"https://via.placeholder.com/400"},

{name:"Бантик набір",price:199,cat:"access",img:"https://via.placeholder.com/400"},

{name:"SALE сукня",price:399,cat:"sale",img:"https://via.placeholder.com/400"}

];

let cart=[];

let selected=null;

/* RENDER */

function render(list=products){

let box=document.getElementById("products");

box.innerHTML="";

list.forEach((p,i)=>{

box.innerHTML+=`

<div class="card" onclick="openModal(${i})">

<img src="${p.img}">

<div class="card-body">

<h4>${p.name}</h4>

<div class="price">${p.price} грн</div>

</div>

</div>`;

});

}

render();

/* FILTER */

function filter(cat){

if(cat==="all") render(products);

else render(products.filter(p=>p.cat===cat));

}

/* MODAL */

function openModal(i){

selected=products[i];

document.getElementById("modal").style.display="flex";

document.getElementById("mimg").src=selected.img;

document.getElementById("mtitle").innerText=selected.name;

document.getElementById("mprice").innerText=selected.price+" грн";

}

function closeModal(e){

if(e.target.id==="modal") document.getElementById("modal").style.display="none";

}

function addModal(){

cart.push(selected);

document.getElementById("count").innerText=cart.length;

renderCart();

}

/* CART */

function toggleCart(){

document.getElementById("cartBox").style.display=

document.getElementById("cartBox").style.display==="block"?"none":"block";

}

function renderCart(){

let box=document.getElementById("cartBox");

let total=0;

box.innerHTML="<h3>Кошик</h3>";

cart.forEach(c=>{

box.innerHTML+=`${c.name} - ${c.price} грн<br>`;

total+=c.price;

});

box.innerHTML+=`<hr><b>Сума: ${total} грн</b>`;

}

/* PHOTO UPLOAD */

function loadPhoto(e){

let img=document.getElementById("preview");

img.src=URL.createObjectURL(e.target.files[0]);

img.style.display="block";

}

/* ORDER */

function sendOrder(e){

e.preventDefault();

let text=

`💖 Little Eva Vibe

Імʼя: ${name.value}

Телефон: ${phone.value}

Місто: ${city.value}

Коментар: ${comment.value}

Товари: ${cart.map(i=>i.name).join(", ")}`;

fetch("https://api.telegram.org/botTOKEN/sendMessage",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

chat_id:"CHAT_ID",

text:text

})

});

alert("Замовлення відправлено 💖");

cart=[];

document.getElementById("count").innerText=0;

}

</script>

</body>

</html>
