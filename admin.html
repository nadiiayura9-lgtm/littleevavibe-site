<!DOCTYPE html>

<html lang="uk">

<head>

<meta charset="UTF-8">

<title>Admin Little Eva Vibe</title>

</head>

<body>

<h2>Адмінка 💖</h2>

<input id="name" placeholder="Назва"><br><br>

<input id="price" placeholder="Ціна"><br><br>

<input id="img" placeholder="Фото URL"><br><br>

<select id="cat">

<option value="girls">Дівчатка</option>

<option value="boys">Хлопчики</option>

<option value="shoes">Взуття</option>

<option value="sale">SALE</option>

</select><br><br>

<button onclick="add()">Додати товар</button>

<ul id="list"></ul>

<script>

let products=JSON.parse(localStorage.getItem("products"))||[];

function add(){

products.push({

name:name.value,

price:price.value,

img:img.value,

cat:cat.value

});

localStorage.setItem("products",JSON.stringify(products));

render();

}

function render(){

list.innerHTML="";

products.forEach(p=>{

list.innerHTML+=`<li>${p.name} - ${p.price} грн (${p.cat})</li>`;

});

}

render();

</script>

</body>

</html>
