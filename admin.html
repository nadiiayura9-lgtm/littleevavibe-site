<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>

body{font-family:Arial;background:#f6f1ec;padding:20px;}

.box{max-width:400px;margin:auto;background:white;padding:15px;border-radius:12px;}

input{width:100%;padding:10px;margin:5px 0;}

button{padding:10px;width:100%;background:black;color:white;border:none;border-radius:10px;}

.item{background:#eee;padding:10px;margin:5px;border-radius:10px;}

</style>

</head>

<body>

<div class="box">

<h2>Admin Panel</h2>

<input id="name" placeholder="Назва товару">

<input id="price" placeholder="Ціна">

<input id="img" placeholder="URL фото">

<button onclick="addProduct()">Додати товар</button>

<hr>

<div id="list"></div>

</div>

<script>

// 🔥 Firebase config (сюди вставиш свій)

const firebaseConfig = {

  apiKey: "YOUR_KEY",

  authDomain: "YOUR_DOMAIN",

  projectId: "YOUR_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

// ➕ Додати товар

function addProduct(){

  db.collection("products").add({

    name: document.getElementById("name").value,

    price: document.getElementById("price").value,

    img: document.getElementById("img").value

  });

}

// 📦 Показ товарів

db.collection("products").onSnapshot(snap=>{

  let html="";

  snap.forEach(doc=>{

    html+=`

    <div class="item">

      ${doc.data().name} - ${doc.data().price} грн

      <button onclick="del('${doc.id}')">X</button>

    </div>`;

  });

  document.getElementById("list").innerHTML=html;

});

// ❌ Видалити

function del(id){

  db.collection("products").doc(id).delete();

}

</script>

</body>

</html>
